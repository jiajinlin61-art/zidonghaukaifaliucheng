[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uads"
version = "0.1.0"
description = "Local reference implementation for Universal AI Development System"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
