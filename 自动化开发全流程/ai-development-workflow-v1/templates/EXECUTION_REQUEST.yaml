schema_version: "1.4"
task_id: P1-T01
task_revision: 1
attempt_id: P1-T01-r1-a1

objective: "<可观察的任务结果>"
purpose: execute
complexity: STANDARD
risk: MEDIUM
task_kind: general

workspace:
  project_root: "<ABSOLUTE_PROJECT_PATH>"
  baseline:
    kind: git
    ref: "<BASE_COMMIT>"

governance:
  project_start_gate:
    # APPROVED / NOT_REQUIRED. PENDING/BLOCKED may not enter Worker execution.
    status: APPROVED
    ref: "<PROJECT_START_GATE_OR_APPROVAL_REF>"
  controller:
    id: "<PROJECT_CONTROLLER_ID>"
    # Optional when the controller platform does not expose a stable session id.
    session: null
  controller_worker_override:
    # Default false. Direct Controller implementation requires explicit authorization.
    allowed: false
    reason: null

scope:
  allowed_paths:
    - src/example/**
    - tests/example/**
  forbidden_paths:
    - secrets/**

inputs: []
dependencies: []

acceptance:
  - id: A1
    criterion: "<可重复验证的验收条件>"

validation:
  # commands / semantic / mixed
  mode: commands
  required_checks:
    - id: V1
      kind: command
      acceptance_ids: [A1]
      command: "<真实验证命令>"

routing:
  execution_profile: auto
  review_profile: auto
  execution_profile_override_reason: null
  review_profile_override_reason: null
  resolved_execution:
    profile: coding-standard
    backend: claude-code
    model: glm-5.2[1M]
    effort: medium
    preflight:
      status: pass
      command: '.\.venv\Scripts\python.exe tools/route_preflight.py --purpose execute --complexity STANDARD --risk MEDIUM'
      exit_code: 0
      evidence: "<ROUTE_PREFLIGHT_EXECUTION_EVIDENCE>"
  resolved_review:
    profile: review-standard
    backend: codex
    model: gpt-5.6-terra
    effort: high
    preflight:
      status: pass
      command: '.\.venv\Scripts\python.exe tools/route_preflight.py --purpose review --complexity STANDARD --risk MEDIUM --worker-backend claude-code'
      exit_code: 0
      evidence: "<ROUTE_PREFLIGHT_REVIEW_EVIDENCE>"

retry:
  attempt_number: 1
  max_retries: 2
  same_fingerprint_failures: 0
  fingerprint: null

stop_conditions:
  - "<数据损失、权限/凭据、范围争议、不可逆操作或明确人工检查点>"

handoff:
  project_controller: gpt-taskboard
  return_to: "<TaskBoard 状态入口或上层 Agent>"
