constraints:
- Keep execution in Phase 0; do not mark existing P00 tasks or Phase 0 complete.
- FULL requires separate plan and design-baseline approvals before implementation;
  STANDARD and FAST use one scaled plan approval.
- Do not change physical model bindings or execution routing policy.
- Do not add a permanent Reviewer agent; use the existing Reviewer role in an independent
  session.
- Do not add deployment or production acceptance steps.
- Preserve current files and report no Git baseline; do not invent commit identifiers.
acceptance_criteria:
- statement: FAST, STANDARD, and FULL use the same execution core with mode-appropriate
    design artifacts.
  verification: automated_or_reviewed
  id: AC-01
- statement: FULL mode requires both plan and design-baseline approval before implementation;
    the validator rejects an unapproved or incomplete design gate.
  verification: automated
  id: AC-02
- statement: UI projects receive prototype and frontend/backend API-contract guidance;
    projects without UI may mark prototype not applicable with a reason.
  verification: automated_or_reviewed
  id: AC-03
- statement: independent review uses a separate session, selects the existing risk-appropriate
    review profile, prefers another backend, and records the reason when falling back
    to the same backend.
  verification: automated_or_reviewed
  id: AC-04
- statement: existing GLM/GPT bindings and the Phase 0 only restriction remain unchanged.
  verification: automated_or_reviewed
required_capabilities:
- code_editing
- structured_output
- tool_use
risk: medium
complexity: standard
recommended_executor: claude-code
recommended_model_profile: coding-standard
validation:
  gate: focused approval-gate tests, bootstrap plan validation, full non-empty test
    suite, independent Review, and semantic consistency check.
  completion_signal: '`P00-S01-T03.completed` with command output and changed-path
    list.'
autonomy:
  mode: stage-gated
expected_outputs:
- complexity-scaled development lifecycle, updated templates and prompts, enforced
  FULL design gate, and task evidence report.
retry_budget:
