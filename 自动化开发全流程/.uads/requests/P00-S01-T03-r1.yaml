schema_version: '1.3'
task_id: P00-S01-T03
task_revision: 1
attempt_id: P00-S01-T03-r1-a3
objective: Integrate complexity-scaled product design artifacts and two FULL-mode
  approval gates into the current workflow, while preserving the Phase 0-only limit
  and current model bindings.
purpose: execute
complexity: STANDARD
risk: MEDIUM
task_kind: general
workspace:
  project_root: E:\自动化开发任务通用流程\自动化开发流程
  baseline:
    kind: no-git
    ref: file-inventory-2026-09-23
governance:
  project_start_gate:
    status: APPROVED
    ref: .uads/approvals/P00-S01-T03.yaml
  controller:
    id: codex
    session: null
  controller_worker_override:
    allowed: false
    reason: null
scope:
  allowed_paths:
  - ai-development-workflow-v1/**
  - tools/project_start_gate_validate.py
  - tests/test_project_start_gate_validate.py
  - .uads/plan.yaml
  - .uads/tasks/P00-S01-T01.yaml
  - .uads/tasks/P00-S01-T03.yaml
  - .uads/approvals/P00-S01-T03.yaml
  - .uads/requests/P00-S01-T03-r1.yaml
  - .uads/results/P00-S01-T03-r1.yaml
  - IMPLEMENTATION_PLAN.md
  - PHASE_0_START.md
  - docs/task-results/P00-S01-T03.md
  - tests/test_bootstrap_validate.py
  - docs/DEVELOPMENT.md
  forbidden_paths:
  - ai-development-workflow-v1/routing/MODEL_BINDINGS.yaml
  - src/**
  - ai-development-workflow-v1/templates/EXECUTION_REQUEST.yaml
  - ai-development-workflow-v1/templates/EXECUTION_RESULT.yaml
inputs:
- ai-development-workflow-v1/DEVELOPMENT_WORKFLOW.md
- ai-development-workflow-v1/policies/DEVELOPMENT_MODES.md
- ai-development-workflow-v1/policies/PROJECT_START_GATE.md
- ai-development-workflow-v1/policies/MODEL_ROUTING.md
- ai-development-workflow-v1/templates/PROJECT_START_GATE.yaml
- ai-development-workflow-v1/roles/REVIEWER.md
- IMPLEMENTATION_PLAN.md
- PHASE_0_START.md
- docs/DEVELOPMENT.md
dependencies: []
acceptance:
- id: AC-01
  criterion: FAST, STANDARD, and FULL use the same execution core with mode-appropriate
    design artifacts.
- id: AC-02
  criterion: FULL requires separate plan and design-baseline approvals before implementation,
    and the validator blocks missing or incomplete design approval.
- id: AC-03
  criterion: UI projects receive prototype and frontend/backend API-contract guidance;
    no-UI projects may mark prototype not applicable with a reason.
- id: AC-04
  criterion: Independent review uses a separate session, an existing risk-appropriate
    review profile, prefers a different backend, and records same-backend fallback
    reason.
- id: AC-05
  criterion: Physical model bindings remain unchanged and Phase 0 remains the only
    authorized phase.
validation:
  mode: mixed
  required_checks:
  - id: V-GATE
    kind: command
    acceptance_ids:
    - AC-02
    command: .venv/Scripts/python.exe -B tools/check_tests.py
  - id: S-WORKFLOW
    kind: semantic
    acceptance_ids:
    - AC-01
    - AC-03
    - AC-04
    - AC-05
    criterion: Review mode matrix, templates, prompts, reviewer routing and Phase
      0 task ordering for consistency with the approved plan.
routing:
  execution_profile: auto
  review_profile: auto
  execution_profile_override_reason: null
  review_profile_override_reason: null
  execution_excluded_backends: []
  execution_fallback_reason: null
  review_excluded_backends:
  - codex
  review_fallback_reason: Codex local configuration fingerprint changed during preflight;
    use the preflight-passing GLM reviewer candidate in a separate session.
  resolved_execution:
    profile: coding-standard
    backend: claude-code
    model: glm-5.2[1M]
    effort: medium
    preflight:
      status: pass
      command: .venv/Scripts/python.exe -B tools/route_preflight.py --purpose execute
        --complexity STANDARD --risk MEDIUM
      exit_code: 0
      evidence: Route preflight passed for Claude Code GLM-5.2; backend version, config
        fingerprint, model probe record, and freshness all passed.
  resolved_review:
    profile: review-standard
    backend: claude-code
    model: glm-5.3[1M]
    effort: high
    preflight:
      status: pass
      command: .venv/Scripts/python.exe -B tools/route_preflight.py --purpose review
        --complexity STANDARD --risk MEDIUM --worker-backend claude-code --exclude-backend
        codex --fallback-reason "Codex local configuration fingerprint changed; use
        preflight-passing GLM candidate."
      exit_code: 0
      evidence: Review preflight passed after excluding Codex because its local config
        fingerprint changed; Claude Code GLM-5.3 passed all local checks.
retry:
  attempt_number: 3
  max_retries: 2
  same_fingerprint_failures: 0
  fingerprint: null
stop_conditions:
- User-approved scope or Phase 0 boundary would need to change.
- Model binding or execution routing changes are required.
- Data loss, credential, permission, or external side effect is encountered.
handoff:
  project_controller: codex
  return_to: current Codex task
